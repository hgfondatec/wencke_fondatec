version: 2

models:
  - name: nonne_bronze_adresse
    description: "Bronze-Tabelle mit Adressdaten aus m36adr"

    config:
      tags:
      - bronze
      - gold_adress

    columns:
      - name: adr_adressnummer
        description: "Eindeutige Adressnummer"

      - name: adr_name
        description: "Name der Adresse"

      - name: adr_adresse
        description: "Adresse der Person/Firma"

      - name: adr_plz
        description: "Postleitzahl"

      - name: adr_stadt
        description: "Stadt"

      - name: adr_nummer
        description: "Telefonnummer der Adresse"

      - name: adr_ansprechpartner
        description: "Ansprechpartner"

      - name: adr_vertreternummer
        description: "Vertreternummer-ID"

      - name: adr_debitorenkonto
        description: "Debitorenkonto"

      - name: adr_praesident
        description: "Präsident"

      - name: adr_rechnungsempfaenger
        description: "Rechnungsempfänger-ID"

      - name: adr_heim
        description: "Heim-ID"

      - name: adr_krankenkasse
        description: "Krankenkasse-ID"

      - name: adr_oe_1
        description: "Organisations-Einheit 1"

      - name: adr_oe_2
        description: "Organisations-Einheit 2"

      - name: adr_oe_3
        description: "Organisations-Einheit 3"

      - name: adr_oe_4
        description: "Organisations-Einheit 4"

      - name: adr_zentrale_GVS_nummer
        description: "Zentrale GVS-Nummer"

      - name: adr_adresstyp
        description: "Typ der Adresse"
  
  - name: nonne_bronze_adressgruppe
    description: "Bronze-Tabelle mit Adressgruppen aus m36adrgrp"

    config:
      tags:
      - bronze
      - gold_adress

    columns:
      - name: adrgruppe_id
        description: "Eindeutige ID der Adressgruppe"

      - name: adrgruppe_name
        description: "Name der Adressgruppe"

  - name: nonne_bronze_artikel
    description: "Bronze-Tabelle mit Artikeldaten aus m36art"

    config:
      tags:
      - bronze
      - gold_artikel
  
    columns:
      - name: art_artikelnummer
        description: "Eindeutige Artikelnummer"

      - name: art_artikelname
        description: "Name des Artikels"

      - name: art_hauptkategorie_id
        description: "ID der Hauptkategorie des Artikels"

      - name: art_nebenkategorie_id
        description: "ID der Nebenkategorie des Artikels"

      - name: art_standardlieferantnummer
        description: "Standardlieferantnummer"

      - name: art_herstellernummer
        description: "Herstellernummer"
        
      - name: art_abc_kategorie
        description: "ABC-Kategorie des Artikels"

  - name: nonne_bronze_belege
    description: >
      Tabelle mit Belegdaten aus der Raw-Quelle m36bel.

    config:
      tags:
        - bronze
        - gold_facts
        - gold_adress

    columns:
      - name: bel_belegstatus_a_n
        description: "Belegstatus"

      - name: bel_belegart
        description: "Art des Belegs."

      - name: bel_belegnummer
        description: "Eindeutige Belegnummer."

      - name: bel_adressnummer
        description: "Adressnummer des zugehörigen Kunden"

      - name: bel_belegdatum
        description: "Datum des Belegs."

      - name: bel_liefer_termindatum
        description: "Geplanter Liefer- oder Termindatum des Belegs."

      - name: bel_projektnummer
        description: "Zugeordnete Projektnummer."

      - name: bel_vertreter
        description: "Vertreternummer"

      - name: bel_steuerart
        description: "Steuerart des Belegs."

      - name: bel_nk_frachtkostenpauschale
        description: "Nebenkosten für Frachtkostenpauschale."

      - name: bel_nk_verpackung
        description: "Nebenkosten für Verpackung."

      - name: bel_nk_mindermengenzuschlag
        description: "Nebenkosten für Mindermengenzuschlag."

      - name: bel_nk_fuell_abnutzgebuehr
        description: "Nebenkosten für Füll- oder Abnutzgebühr."

      - name: bel_nk_gefahrgut
        description: "Nebenkosten für Gefahrgut."

      - name: bel_warenwertnetto
        description: "Netto-Warenwert des Belegs."

      - name: bel_warenwertmwst
        description: "Mehrwertsteuerbetrag auf den Warenwert."

      - name: bel_belegnetto
        description: "Netto-Gesamtbetrag des Belegs."

      - name: bel_belegmwst
        description: "Mehrwertsteuerbetrag des gesamten Belegs."

      - name: bel_interne_belegnummer
        description: "Interne Belegnummer."

      - name: bel_lieferschein_nr
        description: "Zugehörige Lieferscheinnummer."

      - name: bel_blfanummer
        description: "BLFA-Nummer des Belegs."

      - name: bel_belegtyp
        description: "Typ des Belegs."

      - name: bel_beleggruppe
        description: "Beleggruppe des Belegs."

  - name: nonne_bronze_beleggruppe
    description: >
      Mapping-Tabelle für Beleggruppen aus der Raw-Quelle m36bg.
      Enthält die Zuordnung zwischen Beleggruppe, Belegart
      und interner Beleggruppen-ID.

    config:
      tags:
        - bronze
        - gold_facts

    columns:
      - name: bg_beleggruppe
        description: "Bezeichnung oder Kennung der Beleggruppe."

      - name: bg_belegart
        description: "Belegart der zugehörigen Beleggruppe."

      - name: bg_beleggruppe_id
        description: "Interne ID der Beleggruppe."

  - name: nonne_bronze_mandanten
    description: >
      Stammdatentabelle für Mandanten aus der Raw-Quelle m00id0202.
      Enthält grundlegende Informationen wie Name, Zusatzinformationen
      und Adressdaten des Mandanten.

    config:
      tags:
        - bronze_mandanten

    columns:
      - name: mandant_id
        description: "Eindeutige ID des Mandanten."

      - name: mandant_name
        description: "Name des Mandanten."

      - name: mandant_zusatzinfo
        description: "Zusätzliche Informationen oder Zusatzbezeichnung des Mandanten."

      - name: mandant_strasse
        description: "Straßenadresse des Mandanten."

      - name: mandant_plz
        description: "Postleitzahl des Mandanten."

      - name: mandant_stadt
        description: "Stadt des Mandanten."

  - name: nonne_bronze_positionen
    description: >
      Positionstabelle für Belege aus der Raw-Quelle m36pos.
      Enthält Artikel-, Mengen-, Umsatz- und Rohertragsinformationen
      auf Positionsebene.

    config:
      tags:
        - bronze
        - gold_facts

    columns:
      - name: pos_belegart
        description: "Art des Belegs."

      - name: pos_belegnummer
        description: "Eindeutige Belegnummer."

      - name: pos_artikelnummer
        description: "Artikelnummer der Belegposition."

      - name: pos_artikeltext
        description: "Beschreibung oder Text des Artikels."

      - name: pos_gesamtmenge
        description: "Gesamtmenge der Position."

      - name: pos_gesamtumsatz_vor_bonus
        description: "Gesamtumsatz vor Berücksichtigung von Boni."

      - name: pos_ek_einzeln
        description: "Einzelner Einkaufspreis der Position."

      - name: pos_gesamtumsatz
        description: "Gesamtumsatz der Position."

      - name: pos_gesamtrohertrag
        description: "Gesamtrohertrag der Position."

      - name: pos_rohertrag_verrechnet
        description: "Verrechneter Rohertrag der Position."

      - name: pos_rohertrag_vor_bonus
        description: "Rohertrag vor Bonusberücksichtigung."

      - name: pos_umsatz_bonus_vorlaeufig
        description: "Vorläufig berechneter Umsatzbonus."

      - name: pos_umsatz_bonus_endgueltig
        description: "Endgültig berechneter Umsatzbonus."

  - name: nonne_bronze_warengruppen
    description: >
      Stammdatentabelle für Warengruppen aus der Raw-Quelle m36nk.
      Enthält die Warengruppennummer sowie die zugehörige Bezeichnung.

    config:
      tags:
        - bronze
        - gold_artikel

    columns:
      - name: wg_nummer
        description: "Eindeutige Nummer der Warengruppe."

      - name: wg_name
        description: "Bezeichnung der Warengruppe."
